# Render Blueprint: https://render.com/docs/blueprint-spec
# The Starter plan is needed for the persistent disk that keeps game results across restarts and deploys.
services:
  - type: web
    name: impostor-coin
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: coin-data
      mountPath: /var/data
      sizeGB: 1
